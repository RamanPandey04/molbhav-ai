kind = "web"
previewPath = "/"
title = "Molbhav.AI"
description = "Recovered Next.js procurement demo. The prior Vite source is preserved unchanged."
version = "1.0.0"
id = "artifacts/molbhav"
router = "path"

[[services]]
name = "web"
paths = ["/", "/_next/hmr"]
localPort = 23932

[services.development]
run = "cd ../../recovered/molbhav-next && exec node node_modules/next/dist/bin/next dev --hostname 0.0.0.0 --port $PORT"

[services.production]
build = ["sh", "-c", "if [ -d recovered/molbhav-next ]; then cd recovered/molbhav-next; else cd ../../recovered/molbhav-next; fi; npm ci --no-audit --no-fund && npm run build"]
run = ["sh", "-c", "if [ -d recovered/molbhav-next ]; then cd recovered/molbhav-next; else cd ../../recovered/molbhav-next; fi; exec node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT"]

[services.env]
PORT = "23932"
BASE_PATH = "/"
